# Portable, pinned specification derived from the actual `perturb2` environment
# used to run the SPED tests and Norman experiments on 2026-08-11.
# Original platform: linux-64; Python 3.10.18; PyTorch CUDA 12.4 build.
name: sped
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10.18
  - pip=25.2
  - anndata=0.11.4
  - h5py=3.14.0
  - scikit-misc=0.5.1
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - cell-gears==0.1.2
      - numpy==1.26.4
      - pandas==2.2.2
      - scanpy==1.10.2
      - scikit-learn==1.5.1
      - scipy==1.14.1
      - torch==2.6.0+cu124
      - tqdm==4.66.5
